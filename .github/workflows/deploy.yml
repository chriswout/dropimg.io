name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Create local secrets for tests
        run: |
          printf 'IP_HASH_SECRET=ci-integration-secret\nADMIN_TOKEN=ci-admin-token\n' > .dev.vars

      - name: Unit and integration tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Apply local D1 migrations
        run: npx wrangler d1 migrations apply dropimg --local

      - name: Playwright e2e
        run: npm run test:e2e

      # Requires a durable Cloudflare API token (Workers Scripts Edit + D1 Edit),
      # not a short-lived `wrangler login` OAuth token.
      - name: Verify Cloudflare credentials
        if: env.TARGET == 'staging' || env.TARGET == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler whoami

      - name: Apply remote D1 migrations (staging)
        if: env.TARGET == 'staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply dropimg-staging --remote --env staging

      - name: Apply remote D1 migrations (production)
        if: env.TARGET == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply dropimg --remote --env production

      - name: Build
        run: CLOUDFLARE_ENV=${{ env.TARGET }} npm run build

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: CLOUDFLARE_ENV=${{ env.TARGET }} npx wrangler deploy
